name: An idea or improvement
description: Suggest something that would make your farming work easier.
title: "[Idea] "
labels: [enhancement, feedback]
body:
  - type: markdown
    attributes:
      value: "Tell us about the job you want to finish and what would help. Search existing suggestions first. Do not include private farm data or account details."
  - type: textarea
    id: report
    attributes:
      label: Report
      description: Paste your Ag-GIS feedback report, or describe the problem, improvement and benefit.
    validations:
      required: true
  - type: checkboxes
    id: review
    attributes:
      label: Review before sharing
      options:
        - label: I have removed private farm information, passwords and account details from this report and any attachments.
          required: true
