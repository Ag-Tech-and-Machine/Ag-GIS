name: Something went wrong
description: Report a problem with Ag-GIS.
title: "[Bug] "
labels: [bug, feedback]
body:
  - type: markdown
    attributes:
      value: "Please search existing issues first. Share only information you are comfortable sharing with everyone who can read this repository. Never attach original farm data, passwords or account details."
  - type: textarea
    id: report
    attributes:
      label: Report
      description: Paste the report from Ag-GIS Feedback, or describe the job, steps, expected result and what happened instead. Include app/QGIS versions if possible.
      placeholder: "What were you doing? What happened? How can we see it?"
    validations:
      required: true
  - type: checkboxes
    id: review
    attributes:
      label: Review before sharing
      options:
        - label: I have removed private farm information, passwords and account details from this report and any attachments.
          required: true
